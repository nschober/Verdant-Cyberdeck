name: Software checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk python3-pil python3-pil.imagetk python3-evdev xterm fonts-dejavu-core
      - name: Compile Python
        run: python3 -m compileall -q cyberdeck manage.py verify.py
      - name: Validate shell syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
      - name: Check publication boundaries
        run: python3 scripts/check_publication.py
      - name: Run portable behavioral tests
        run: python3 -m unittest discover -s tests -v
      - name: Render offscreen dashboard
        run: ./run.sh --self-test
      # No installer, service control, discovery, privileged app or hardware test runs in CI.
